[package]
name = "credact"
version = "0.1.0"
authors = ["Matt Cavender"]
description = "Inject credentials into a child process and redact them from its output"
license = "MIT"
repository = "https://github.com/visionsofparadise/credact"
publish = false
edition = "2021"
rust-version = "1.88"

[dependencies]
aho-corasick = "1"
base64 = "0.22"
percent-encoding = "2"
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "job-object"] }
serde_json = "1"
signal-hook = "0.4.4"
url = "2"
zeroize = "1"

[lints.rust]
nonstandard_style = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
which = "8.0.6"
