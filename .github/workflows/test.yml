name: Test

on:
   push:
      branches: [main]
   workflow_dispatch:

jobs:
   test:
      runs-on: ${{ matrix.os }}
      timeout-minutes: 20
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-latest
                 targets: --target linux-x64 --target linux-arm64
               - os: windows-latest
                 targets: --target windows-x64 --target windows-arm64
               - os: macos-latest
                 targets: --target darwin-arm64 --target darwin-x64
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: "24"

         - run: npm install -g npm@12

         - run: npm ci

         - run: npm run check

         - run: npm run unit

         - run: npm run build:npm

         - run: node build.mjs ${{ matrix.targets }}

         - run: node smoke.mjs
